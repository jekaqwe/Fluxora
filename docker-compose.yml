
services:
  postgres:
    image: postgres:17-alpine
    container_name: fluxora-postgres-local
    restart: unless-stopped

    environment:
      POSTGRES_USER: fluxora
      POSTGRES_PASSWORD: fluxora_local_dev
      POSTGRES_DB: fluxora

    ports:
      - "5432:5432"

    volumes:
      - fluxora_local_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxora -d fluxora"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fluxora_local_data:
