name: Temporary backend formatting

on:
  push:
    branches:
      - revision
    paths:
      - ".github/workflows/backend-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision
        uses: actions/checkout@v4
        with:
          ref: revision
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Format Go files
        run: |
          find backend -type f -name '*.go' -print0 | xargs -0 gofmt -w

      - name: Format SQL files
        run: |
          sudo apt-get update
          sudo apt-get install -y pgformatter
          find backend/database -type f -name '*.sql' -print0 | xargs -0 -r pg_format -i --spaces 4

      - name: Format Markdown documentation
        run: |
          npx --yes prettier@3.6.2 --write "backend/**/*.md"

      - name: Run backend tests
        working-directory: backend
        run: go test ./...

      - name: Commit formatted files and remove temporary workflow
        run: |
          rm .github/workflows/backend-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend .github/workflows/backend-format.yml
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git commit -m "style(backend): apply consistent formatting"
          git push origin revision
