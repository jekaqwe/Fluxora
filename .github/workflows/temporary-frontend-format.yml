name: Temporary frontend formatting

on:
  push:
    branches:
      - revision
    paths:
      - .github/workflows/temporary-frontend-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision
        uses: actions/checkout@v4
        with:
          ref: revision
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Format frontend source
        run: npx --yes prettier@3.6.2 --write "frontend/src/**/*.{ts,tsx,css}"

      - name: Commit formatted source and remove temporary workflow
        run: |
          rm .github/workflows/temporary-frontend-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src
          git add -u .github/workflows/temporary-frontend-format.yml
          git commit -m "style(frontend): format src files with Prettier"
          git push origin HEAD:revision
