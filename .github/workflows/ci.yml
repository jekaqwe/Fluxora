name: CI

on:
  pull_request:
    branches: [Develop]
  push:
    branches: [Develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fluxora_test
          POSTGRES_PASSWORD: fluxora_test
          POSTGRES_DB: fluxora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxora_test -d fluxora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - run: go build -o /tmp/fluxora-server ./cmd/server
      - name: Apply all migrations against PostgreSQL
        env:
          DATABASE_URL: postgres://fluxora_test:fluxora_test@localhost:5432/fluxora_test?sslmode=disable
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
          /tmp/fluxora-server > /tmp/fluxora-server.log 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/health > /dev/null; then
              kill "$SERVER_PID"
              wait "$SERVER_PID" || true
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/fluxora-server.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/fluxora-server.log
          kill "$SERVER_PID" || true
          exit 1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
