name: Temporary frontend verification

on:
  push:
    branches:
      - revision
    paths:
      - .github/workflows/temporary-frontend-verification.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision
        uses: actions/checkout@v4
        with:
          ref: revision
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Remove temporary workflow
        if: always()
        run: |
          rm .github/workflows/temporary-frontend-verification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/temporary-frontend-verification.yml
          git commit -m "chore: remove temporary frontend verification workflow"
          git push origin HEAD:revision
